<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cube · candle shop</title>
  <!-- Google Font & Font Awesome for clean icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf7f2;
      font-family: 'Inter', sans-serif;
      color: #2e2b27;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* subtle texture / warm background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(255, 235, 205, 0.4) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* header / nav */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1rem 0;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #2e2b27;
      position: relative;
      display: inline-block;
    }

    .logo span {
      display: inline-block;
      animation: floatLogo 3s ease-in-out infinite;
    }

    .logo span:nth-child(2) { animation-delay: 0.2s; }
    .logo span:nth-child(3) { animation-delay: 0.4s; }
    .logo span:nth-child(4) { animation-delay: 0.6s; }

    @keyframes floatLogo {
      0% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    .nav-links {
      display: flex;
      gap: 2.2rem;
      font-weight: 400;
      color: #5f5a54;
    }

    .nav-links a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-block;
    }

    .nav-links a:hover {
      color: #b57e5c;
      transform: translateY(-2px);
    }

    .cart-icon {
      position: relative;
      font-size: 1.2rem;
      color: #2e2b27;
      transition: transform 0.2s;
    }

    .cart-icon:hover {
      transform: scale(1.05);
    }

    /* hero section */
    .hero {
      display: flex;
      align-items: center;
      gap: 3rem;
      margin-top: 2rem;
      margin-bottom: 4rem;
      flex-wrap: wrap;
    }

    .hero-content {
      flex: 1 1 400px;
      animation: slideFade 1.2s ease forwards;
    }

    .hero-image {
      flex: 1 1 400px;
      display: flex;
      justify-content: center;
      animation: slideFade 1.2s 0.2s ease forwards;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    @keyframes slideFade {
      0% {
        opacity: 0;
        transform: translateY(25px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-image img {
      max-width: 100%;
      width: 100%;
      max-width: 360px;
      border-radius: 32px;
      box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.3), 0 15px 25px -10px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      object-fit: cover;
      aspect-ratio: 736 / 1307;
      display: block;
    }

    .hero-image img:hover {
      transform: scale(1.02) translateY(-6px);
      box-shadow: 0 40px 50px -20px rgba(0, 0, 0, 0.4);
    }

    .hero-content h1 {
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero-content h1 .highlight {
      color: #b57e5c;
      display: inline-block;
      animation: softGlow 2.5s infinite alternate;
    }

    @keyframes softGlow {
      0% { text-shadow: 0 0 4px rgba(181, 126, 92, 0.1); }
      100% { text-shadow: 0 0 16px rgba(181, 126, 92, 0.4); }
    }

    .hero-content p {
      font-size: 1.2rem;
      color: #5f5a54;
      max-width: 520px;
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      background: #2e2b27;
      color: #faf7f2;
      padding: 1rem 2.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      letter-spacing: 0.5px;
      border: none;
      cursor: pointer;
      transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 8px 18px -8px rgba(46, 43, 39, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn i {
      margin-left: 8px;
      transition: transform 0.25s;
    }

    .btn:hover {
      background: #b57e5c;
      transform: translateY(-4px);
      box-shadow: 0 20px 30px -10px rgba(181, 126, 92, 0.5);
    }

    .btn:hover i {
      transform: translateX(5px);
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.4s, height 0.4s;
    }

    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    /* subtle floating animation for entire image */
    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .hero-image {
      animation: slideFade 1.2s 0.2s ease forwards, gentleFloat 6s 1.4s infinite ease-in-out;
    }

    /* featured badge / mini text */
    .hero-content .badge {
      display: inline-block;
      background: rgba(181, 126, 92, 0.15);
      color: #b57e5c;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      margin-bottom: 1.2rem;
      letter-spacing: 0.5px;
      backdrop-filter: blur(2px);
    }

    /* small product detail row */
    .product-meta {
      display: flex;
      gap: 2rem;
      margin-top: 2rem;
      color: #7a736c;
      font-size: 0.95rem;
    }

    .product-meta i {
      color: #b57e5c;
      margin-right: 6px;
    }

    /* footer / trust */
    .footer-note {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #e3ddd6;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      color: #7a736c;
      font-size: 0.9rem;
    }

    /* responsiveness */
    @media (max-width: 700px) {
      .container {
        padding: 1rem 1.5rem;
      }

      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        gap: 1.5rem;
        width: 100%;
        justify-content: space-between;
      }

      .hero {
        flex-direction: column-reverse;
        text-align: center;
        margin-top: 1rem;
        gap: 2rem;
      }

      .hero-content p {
        margin-left: auto;
        margin-right: auto;
      }

      .product-meta {
        justify-content: center;
      }

      .hero-image img {
        max-width: 280px;
      }

      .btn {
        padding: 0.9rem 2.2rem;
      }
    }

    @media (max-width: 400px) {
      .nav-links {
        font-size: 0.9rem;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- header -->
    <nav class="navbar">
      <div class="logo">
        <span>c</span><span>u</span><span>b</span><span>e</span>
      </div>
      <div class="nav-links">
        <a href="#">shop</a>
        <a href="#">about</a>
        <a href="#">journal</a>
        <a href="#" class="cart-icon"><i class="fas fa-shopping-bag"></i></a>
      </div>
    </nav>

    <!-- hero -->
    <section class="hero">
      <div class="hero-content">
        <div class="badge">
          <i class="fas fa-fire" style="margin-right: 6px;"></i> new winter collection
        </div>
        <h1>
          warm light,<br>
          <span class="highlight">pure calm.</span>
        </h1>
        <p>
          Hand-poured candles inspired by quiet moments. Minimal form, deep fragrance — 
          let cube transform your space.
        </p>

        <!-- BUTTON with animation -->
        <a href="#" class="btn">
          explore candles <i class="fas fa-arrow-right"></i>
        </a>

        <div class="product-meta">
          <span><i class="fas fa-leaf"></i> natural soy wax</span>
          <span><i class="fas fa-clock"></i> 45+ hr burn</span>
        </div>
      </div>

      <!-- hero image (product image from the shared link) 
           Using the Pinterest image URL extracted from the provided link:
           https://i.pinimg.com/736x/f8/82/58/f882583859c22c0ee74d5451c1d7cdc6.jpg 
      -->
      <div class="hero-image">
        <img 
          src="https://i.pinimg.com/736x/f8/82/58/f882583859c22c0ee74d5451c1d7cdc6.jpg" 
          alt="Elegant cube candle on wooden stand"
          loading="eager"
        >
      </div>
    </section>

    <!-- extra footer / trust badges (minimal) -->
    <div class="footer-note">
      <span><i class="fas fa-seedling" style="color: #b57e5c; margin-right: 6px;"></i> vegan & cruelty-free</span>
      <span><i class="fas fa-recycle" style="color: #b57e5c; margin-right: 6px;"></i> recyclable packaging</span>
      <span><i class="fas fa-truck" style="color: #b57e5c; margin-right: 6px;"></i> free shipping over $60</span>
    </div>
  </div>

  <!-- small additional animation for product meta icons -->
  <style>
    .product-meta i, .footer-note i {
      transition: transform 0.2s;
    }
    .product-meta span:hover i, .footer-note span:hover i {
      transform: scale(1.15);
    }
    .product-meta span, .footer-note span {
      transition: color 0.2s;
    }
    .product-meta span:hover, .footer-note span:hover {
      color: #2e2b27;
    }
  </style>
</body>
</html>
